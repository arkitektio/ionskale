syntax = "proto3";

package ionscale.v1;

option go_package = "github.com/jsiebens/ionscale/pkg/gen/ionscale/v1;ionscalev1";

message User {
  uint64 id = 1;
  string name = 2;
  string role = 3;
  // the account's external id (the OIDC subject); empty for service users
  string external_id = 4;
}

message ListUsersRequest {
  uint64 tailnet_id = 1;
}

message ListUsersResponse {
  repeated User users = 1;
}

message DeleteUserRequest {
  uint64 user_id = 1;
}

message DeleteUserResponse {}

message RevokeAccountRequest {
  // the account's external id: the OIDC subject as issued by the identity
  // provider
  string external_id = 1;
  // when set, only users in tailnets bound to this organization are revoked
  string organization = 2;
}

message RevokeAccountResponse {
  // the tailnets the account was revoked from
  repeated uint64 tailnet_ids = 1;
}
