syntax = "proto3";

package ionscale.v1;

import "ionscale/v1/dns.proto";

option go_package = "github.com/jsiebens/ionscale/pkg/gen/ionscale/v1;ionscalev1";

message Tailnet {
  uint64 id = 1;
  string name = 2;
  string iam_policy = 3;
  string acl_policy = 4;
  DNSConfig dns_config = 5;

  bool service_collection_enabled = 6;
  bool file_sharing_enabled = 7;
  bool ssh_enabled = 8;
  bool machine_authorization_enabled = 9;

  string organization = 10;
  bool tailnet_lock_enabled = 11;
}

message CreateTailnetRequest {
  string name = 1;
  string iam_policy = 2;
  string acl_policy = 3;
  DNSConfig dns_config = 4;

  bool service_collection_enabled = 5;
  bool file_sharing_enabled = 6;
  bool ssh_enabled = 7;
  bool machine_authorization_enabled = 8;

  string organization = 9;
}

message CreateTailnetResponse {
  Tailnet tailnet = 1;
}

// UpdateTailnetRequest is a partial update: policies and the DNS config are
// replaced when non-empty, the feature flags only when set, and the tailnet is
// renamed when name is non-empty.
message UpdateTailnetRequest {
  uint64 tailnet_id = 1;
  string iam_policy = 2;
  string acl_policy = 3;
  DNSConfig dns_config = 4;

  optional bool service_collection_enabled = 5;
  optional bool file_sharing_enabled = 6;
  optional bool ssh_enabled = 7;
  optional bool machine_authorization_enabled = 8;

  // new name for the tailnet (system admin only); changes the MagicDNS suffix
  // of every machine in it
  string name = 9;
}

message UpdateTailnetResponse {
  Tailnet tailnet = 1;
}

message GetTailnetRequest {
  uint64 id = 1;
}

message GetTailnetResponse {
  Tailnet tailnet = 1;
}

message GetTailnetByOrganizationRequest {
  string organization = 1;
}

message GetTailnetByOrganizationResponse {
  Tailnet tailnet = 1;
}

message ListTailnetsRequest {
  // when set, only tailnets bound to this organization are returned
  // (system admin only)
  string organization = 1;
}

message ListTailnetsResponse {
  repeated Tailnet tailnet = 1;
}

message DeleteTailnetRequest {
  uint64 tailnet_id = 1;
  bool force = 2;
}

message DeleteTailnetResponse {}

message GetDERPMapRequest {
  uint64 tailnet_id = 1;
}

message GetDERPMapResponse {
  bytes value = 1;
}

message SetDERPMapRequest {
  uint64 tailnet_id = 1;
  bytes value = 2;
}

message SetDERPMapResponse {
  bytes value = 1;
}

message ResetDERPMapRequest {
  uint64 tailnet_id = 1;
}

message ResetDERPMapResponse {}

message EnableFileSharingRequest {
  uint64 tailnet_id = 1;
}

message EnableFileSharingResponse {}

message DisableFileSharingRequest {
  uint64 tailnet_id = 1;
}

message DisableFileSharingResponse {}

message EnableServiceCollectionRequest {
  uint64 tailnet_id = 1;
}

message EnableServiceCollectionResponse {}

message DisableServiceCollectionRequest {
  uint64 tailnet_id = 1;
}

message DisableServiceCollectionResponse {}

message EnableSSHRequest {
  uint64 tailnet_id = 1;
}

message EnableSSHResponse {}

message DisableSSHRequest {
  uint64 tailnet_id = 1;
}

message DisableSSHResponse {}

message EnableMachineAuthorizationRequest {
  uint64 tailnet_id = 1;
}

message EnableMachineAuthorizationResponse {}

message DisableMachineAuthorizationRequest {
  uint64 tailnet_id = 1;
}

message DisableMachineAuthorizationResponse {}

message EnableTailnetLockRequest {
  uint64 tailnet_id = 1;
}

message EnableTailnetLockResponse {}

message DisableTailnetLockRequest {
  uint64 tailnet_id = 1;
}

message DisableTailnetLockResponse {}

// NodeLockState is one machine's standing under tailnet lock. A machine whose
// node key carries no authority signature cannot be reached by locked peers
// until an existing signing node signs it.
message NodeLockState {
  uint64 machine_id = 1;
  string name = 2;
  bool signed = 3;
}

message GetTailnetLockStatusRequest {
  uint64 tailnet_id = 1;
}

// GetTailnetLockStatusResponse separates the two things that are easy to
// conflate: the control plane grants the *capability*, but the key authority
// itself only exists once a client has run `tailscale lock init`. A tailnet can
// sit with capability_enabled and no authority indefinitely.
message GetTailnetLockStatusResponse {
  bool capability_enabled = 1;
  bool authority_active = 2;
  // authority_disabled means an authority existed and was shut down with a
  // disablement secret, which is not the same as never having had one.
  bool authority_disabled = 3;
  string head = 4;
  repeated NodeLockState nodes = 5;
}
