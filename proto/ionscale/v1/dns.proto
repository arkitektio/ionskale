syntax = "proto3";

package ionscale.v1;

option go_package = "github.com/jsiebens/ionscale/pkg/gen/ionscale/v1;ionscalev1";

message GetDNSConfigRequest {
  uint64 tailnet_id = 1;
}

message GetDNSConfigResponse {
  DNSConfig config = 1;
}

message SetDNSConfigRequest {
  uint64 tailnet_id = 1;
  DNSConfig config = 2;
}

message SetDNSConfigResponse {
  DNSConfig config = 1;
  string message = 2;
}

message DNSConfig {
  bool magic_dns = 1;
  bool override_local_dns = 2;
  repeated string nameservers = 3;
  map<string, Routes> routes = 4;
  string magic_dns_suffix = 5;
  bool https_certs = 6;
  repeated string search_domains = 7;
  // static records answered by MagicDNS in addition to machine names, e.g.
  // to give a service a stable name inside the tailnet
  repeated DNSRecord extra_records = 8;
}

message Routes {
  repeated string routes = 1;
}

message DNSRecord {
  // fully qualified name of the record
  string name = 1;
  // record type: A or AAAA; when empty it is derived from the value
  string type = 2;
  // the IP address the name resolves to
  string value = 3;
}
